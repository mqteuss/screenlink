<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:;" />
    <title>Compartilhar tela</title>
    <link rel="stylesheet" href="./display-picker.css" />
  </head>
  <body>
    <header class="picker-header">
      <div>
        <span class="eyebrow">SCREENLINK</span>
        <h1>O que você quer compartilhar?</h1>
        <p>Escolha uma tela inteira ou somente uma janela.</p>
      </div>
      <button class="icon-button" id="close-picker" type="button" aria-label="Cancelar compartilhamento">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
    </header>

    <nav class="picker-tabs" aria-label="Tipo de fonte">
      <button class="is-active" type="button" data-filter="screen">Telas <span id="screen-count">0</span></button>
      <button type="button" data-filter="window">Janelas <span id="window-count">0</span></button>
    </nav>

    <main>
      <div class="source-grid" id="source-grid" aria-live="polite"></div>
      <div class="empty-state" id="empty-state" hidden>Nenhuma fonte disponível.</div>
    </main>

    <footer>
      <span id="audio-note">No Windows, o áudio do sistema acompanha o compartilhamento quando solicitado.</span>
      <button class="cancel-button" id="cancel-picker" type="button">Cancelar</button>
    </footer>

    <script type="module" src="./display-picker-renderer.mjs"></script>
  </body>
</html>
