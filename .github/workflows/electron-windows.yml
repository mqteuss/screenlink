name: Electron Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar e gerar executáveis
        run: npm run desktop:dist

      - name: Publicar artefatos do Windows
        uses: actions/upload-artifact@v7
        with:
          name: ScreenLink-Windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
